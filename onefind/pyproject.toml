[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onefind"
version = "0.1.0"
description = "One's approach to finding files"
requires-python = ">=3.10"
dependencies = ["onepatterns>=0.1.0"]

[project.scripts]
onefile = "onefile.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
